<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Property</title>
    <style>
        h1 {
            font-size: 60px;
        }

        p {
            width: 550px;
            height: 500px;
            color: white;
            font-size: 40px;
            margin-bottom: 40px;
        }

        .red { background: red; }
        .green { background: green; }
        .blue { background: blue; }
    </style>
</head>

<body>
    <h1>CSS Display Property</h1>

    <p class="red">Red Paragraph</p>
    <p class="green">Green Paragraph</p>
    <p class="blue">Blue Paragraph</p>
</body>
</html>
